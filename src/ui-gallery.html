<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>simTrain · 3 finished runs</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>body{margin:0;background:#0b0f14;color:#dfe7ef;font:15px/1.55 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{color:#3ddc97;margin:.2em 0}a{color:#3ddc97}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{font:inherit;background:#121a23;color:#dfe7ef;border:1px solid #2a3a4a;border-radius:20px;padding:6px 14px;cursor:pointer}.tabs button[aria-pressed=true]{background:#3ddc97;color:#04130b;font-weight:700}
.m{padding:10px 14px;border-radius:10px;margin:8px 0;background:#121a23;overflow-x:auto}.m.user{background:#17324a;margin-left:10%}.who{font-size:11px;opacity:.6;text-transform:uppercase}table{border-collapse:collapse;font-size:13px}td,th{border:1px solid #2a3a4a;padding:4px 6px}img{max-width:100%;border-radius:8px}
.sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;border:1px solid #2a3a4a;border-radius:10px}.big{font-size:28px;font-weight:800;color:#3ddc97}</style></head>
<body><main><h1>Three finished runs</h1><p>Real simTrain sessions played to the end on the live build, each with its full debrief, the frameworks it was built around and the seed reveal. <a href="/">Try your own →</a></p>
<div class="tabs" id="tabs"></div><div id="sum"></div><div id="log">Loading…</div></main>
<script>
const $=id=>document.getElementById(id);const md=t=>DOMPurify.sanitize(marked.parse(t||''));let G=[];
function show(i){const g=G[i];[...$('tabs').children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
 const sc=g.scorecard||{};$('sum').innerHTML=`<div class="sum"><span class="big">${sc.total??'–'}/100</span><span>${sc.level||''}</span><span style="flex:1"></span><a href="/verify?g=${i}">✓ Verify these dice yourself</a></div>`+((im=>im?`<figure style="margin:12px 0"><img src="${im}" alt="Opening scene image generated during this run" loading="lazy"><figcaption style="font-size:12px;opacity:.7">Opening scene, generated during this run</figcaption></figure>`:'')((g.transcript||[]).find(m=>m.image)?.image));
 $('log').innerHTML=(g.transcript||[]).filter(m=>m.who!=='system').map(m=>`<div class="m ${m.who==='user'?'user':''}"><div class="who">${m.who==='user'?'trainee':'simTrain'}</div>${md(m.text)}</div>`).join('')}
fetch('/api/gallery').then(r=>r.json()).then(j=>{G=j.runs||[];if(!G.length){$('log').textContent='Gallery coming soon.';return}
 $('tabs').innerHTML=G.map((g,i)=>`<button onclick="show(${i})">${(g.label||g.title||('Run '+(i+1))).replace(/</g,'&lt;')}</button>`).join('');show(0)});
</script></body></html>
